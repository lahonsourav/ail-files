name: Bug report
description: A file came out wrong, or the engine failed.
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Which file type?
      options: [PowerPoint (.pptx), PDF, Word (.docx), Excel (.xlsx), CLI, Themes]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The JSON you used
      description: The smallest input that shows the problem. Remove anything private.
      render: json
  - type: input
    id: version
    attributes:
      label: Version and Node version
      placeholder: "ail-files 0.1.0, Node 22"
